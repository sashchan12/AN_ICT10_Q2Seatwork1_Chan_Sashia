<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIST</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px;
            color: #3d1642;
            background: url("bg.jpg") center / cover no-repeat fixed;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .list-card {
            width: 100%;
            max-width: 460px;
            padding: 70px 50px;
            background: rgba(255, 255, 255, 0.5);
            border: 10px solid rgba(142, 42, 143, 0.5);
            border-radius: 15px;
            backdrop-filter: blur(1.5px);
            -webkit-backdrop-filter: blur(3px);
            box-shadow: 0 10px 35px rgba(110, 30, 120, 0.18);
        }

        h1 {
            font-size: 55px;
            font-weight: 700;
            color: #6d1b72;
            text-align: center;
            margin-bottom: 20px;
        }

        .intro {
            text-align: center;
            color: #6b4a70;
            margin-bottom: 50px;
        }

        h3 {
            font-size: 45px;
            color: #6d1b72;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(109, 27, 114, 0.35);
            color: #3d1642;
        }

        .form-control:focus {
            background: #fff;
            border-color: #8e2a8f;
            box-shadow: 0 0 0 0.2rem rgba(142, 42, 143, 0.2);
        }

        .btn-add {
            background: #8e2a8f;
            border-color: #8e2a8f;
            color: #fff;
            font-weight: 600;
        }

        .btn-add:hover,
        .btn-add:focus {
            background: #6d1b72;
            border-color: #6d1b72;
            color: #fff;
        }

        .btn-delete {
            background: transparent;
            border: 1px solid #b3261e;
            color: #b3261e;
            font-weight: 600;
        }

        .btn-delete:hover,
        .btn-delete:focus {
            background: #b3261e;
            border-color: #b3261e;
            color: #fff;
        }

        #output div {
            padding: 20px 30px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.55);
            border-left: 30px solid #8e2a8f;
            border-radius: 5px;
        }

        #message {
            margin: 30px 0 0;
            text-align: center;
            font-style: italic;
            color: #6d1b72;
        }

        #message:empty {
            display: none;
        }
    </style>
</head>

<body>
    <main class="list-card">
        <h1>SCIENCE CLUB</h1>
        <p class="intro">Member Verification</p>

        <input type="text" id="first_name" class="form-control mb-3" placeholder="First Name">
        <input type="text" id="last_name" class="form-control mb-3" placeholder="Last Name">

        <div class="d-flex gap-2">
            <button type="button" class="btn btn-add flex-fill" py-click="verify_member">ENTER</button>
            <button type="button" class="btn btn-delete flex-fill" py-click="reset_form">RESET</button>
        </div>

        <p id="message" class="mt-3"></p>
    </main>

    <py-script src="main.py"></py-script>

</body>
</html>
